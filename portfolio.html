// ─── CARDS ────────────────────────────────────────────────────────────────────
function ParallaxCard({ cs, onSelect }) {
  const ref = useRef(null); const imgRef = useRef(null);
  useEffect(() => {
    const el = ref.current; const img = imgRef.current; if (!el || !img) return;
    const fn = () => { const r = el.getBoundingClientRect(); img.style.transform = `translateY(${Math.round((1 - r.bottom / (window.innerHeight + r.height)) * 80)}px)`; };
    window.addEventListener("scroll", fn, { passive: true }); fn();
    return () => window.removeEventListener("scroll", fn);
  }, []);
  return (
    <div ref={ref} onClick={() => onSelect(cs.id)} style={{ width: "100%", height: "65vh", minHeight: 400, overflow: "hidden", cursor: "pointer", position: "relative", background: "#111" }}>
      <div ref={imgRef} style={{ position: "absolute", inset: "-80px 0", transition: "transform 0.05s linear" }}>
        <img src={cs.cardImage} alt="" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block", opacity: 1 }} />
      </div>
      <div style={{ position: "absolute", inset: 0, background: "linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.05) 45%, rgba(0,0,0,0) 70%)", pointerEvents: "none" }} />
      <div style={{ position: "absolute", inset: 0, background: "linear-gradient(to right, rgba(0,0,0,0.2) 0%, transparent 50%)", pointerEvents: "none" }} />
      <div style={{ position: "absolute", bottom: 44, left: 44, right: 44 }}>
        <p style={{ fontSize: 11, fontWeight: 600, letterSpacing: "0.1em", textTransform: "uppercase", color: "rgba(255,255,255,0.45)", marginBottom: 12 }}>{cs.tag}</p>
        <h2 style={{ fontSize: "clamp(28px,4vw,58px)", fontWeight: 800, letterSpacing: "-0.03em", lineHeight: 1.05, color: "#fff", marginBottom: 14, maxWidth: 620 }}>{cs.title}</h2>
        <p style={{ fontSize: 14, fontWeight: 300, color: "rgba(255,255,255,0.5)", lineHeight: 1.65, maxWidth: 380, marginBottom: 22 }}>{cs.hero}</p>
        <div style={{ display: "inline-flex", alignItems: "center", gap: 8, fontSize: 12, fontWeight: 600, letterSpacing: "0.06em", color: "#fff" }}>View case study →</div>
      </div>
      <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, height: 1, background: "rgba(255,255,255,0.06)" }} />
    </div>
  );
}

function SmallCard({ item, onSelect }) {
  const ref = useRef(null); const imgRef = useRef(null);

    const el = ref.current; const img = imgRef.current; if (!el || !img) return;
    const fn = () => { const r = el.getBoundingClientRect(); img.style.transform = `translateY(${Math.round((1 - r.bottom / (window.innerHeight + r.height)) * 50)}px)`; };
    window.addEventListener("scroll", fn, { passive: true }); fn();
    return () => window.removeEventListener("scroll", fn);
  }, []);
  return (
    <div ref={ref} onClick={onSelect || undefined} style={{ height: "48vh", minHeight: 300, overflow: "hidden", position: "relative", background: "#111", cursor: onSelect ? "pointer" : "default" }}>
