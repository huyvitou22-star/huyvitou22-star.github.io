iry date. Once submitted, our team reviews it and approves it within a few hours. You’ll get a notification when your deal goes live.`},{id:`gs4`,title:`Browsing and discovering deals`,body:`The homepage shows personalized deal recommendations, new arrivals, and trending promotions. Use the search bar to find specific deals or stores. Tap any category filter to browse by type (Food, Beauty, Fashion, Technology). Scroll down to the Discover section for a Pinterest-style browsing experience. Dark mode is available in your profile settings.`}]},{id:`deals`,name:`Deals & Promotions`,icon:`<path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>`,articles:[{id:`d1`,title:`How to save a deal`,body:`When browsing deals, tap the heart icon on any deal card to save it. Your saved deals appear in the ‘Saved’ tab, organized by category. Saved deals sync across all your devices when you’re logged in. To remove a saved deal, tap the heart icon again. You don’t need an account to browse, but saving requires sign-in.`},{id:`d2`,title:`How discounts work`,body:`Stores set their own original and discounted prices. The discount percentage is calculated automatically and shown as a badge on the deal card. Some deals are time-limited — the expiry date is displayed on the detail page. Deals with discounts of 20% or more show a red badge. All prices are in USD.`},{id:`d3`,title:`Reporting a deal`,body:`If you find a deal that seems incorrect, misleading, or inappropriate, open the deal detail page, tap the share icon, and select ‘Report’. Describe the issue and submit. Our team reviews all reports within 24 hours and takes action if the deal violates our guidelines. You can report expired deals, wrong pricing, or inappropriate content.`},{id:`d4`,title:`Deal categories explained`,body:`Deals are organized into categories: Food & Drinks, Beauty, Fashion, Technology, Lifestyle, and Travel. Stores assign a category when posting. You can filter by category using the tabs below the search bar. If you selected interests during onboarding, your homepage prioritizes those categories automatically.`},{id:`d5`,title:`Understanding deal expiry`,body:`Each deal has an expiry date set by the store. Time-limited deals show a countdown on the detail page. Expired deals are automatically removed from the homepage but may still appear in search briefly. Stores can extend or repost expired deals at any time.`}]},{id:`account`,name:`Account & Settings`,icon:`<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>`,articles:[{id:`a1`,title:`Changing your profile picture`,body:`Go to your profile menu and tap ‘View profile’, then tap ‘Edit’. Click on your avatar photo to upload a new image. Supported formats are JPG and PNG, up to 5MB. Your new photo will appear across the platform immediately — on your profile, in chats, and on any deals you’ve posted.`},{id:`a2`,title:`Switching between light and dark mode`,body:`Open your profile menu and look for the theme toggle (sun/moon icon). You can switch between Light and Dark mode instantly. The entire app — including all pages, cards, and navigation — adapts to your chosen theme.`},{id:`a3`,title:`Deleting your account`,body:`Go to your profile, tap ‘Edit’, and scroll to the bottom. Tap ‘Delete account’ and confirm. This action is permanent and cannot be undone. All your data, saved deals, chat history, and store information (if applicable) will be permanently removed. If you’re a business, all your published deals will also be deleted.`},{id:`a4`,title:`Updating your email or name`,body:`Open your profile menu, tap ‘View profile’, then ‘Edit’. Update your name or email in the respective fields and save. Your updated name will appear immediately across the platform. If you change your email, you may need to verify the new address.`},{id:`a5`,title:`Managing notifications`,body:`ePromotion sends notifications for saved deal updates, new deals from stores you follow, and chat messages. You can manage these through your device’s notification settings. We don’t send marketing emails without your consent.`}]},{id:`business`,name:`For Businesses`,icon:`<rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/>`,articles:[{id:`b1`,title:`How deal approval works`,body:`All deals are reviewed by our team before they go live. After submitting, your deal enters a ‘Pending’ state. We check for: accurate pricing, clear photos (no blurry or misleading images), appropriate content, and policy compliance. Most deals are approved within 2–4 hours during business hours. You’ll receive a notification when approved or if changes are needed.`},{id:`b2`,title:`Understanding your dashboard`,body:`The store dashboard shows your deal performance in real time: total views, saves, clicks, and active deal count. Use the list view to see all your deals with individual stats. The data updates every few minutes. Use these insights to understand which promotions work best and plan your upcoming deals.`},{id:`b3`,title:`Boosting your deals`,body:`Boost gives your deal premium placement in the ‘Suggestion for You’ section and higher visibility in category feeds. Boosted deals are shown to more users and tagged as ‘Suggested’. Pricing starts at $3.99 for 3 days. You can add boost when posting or later from the deal edit screen. Contact our team for custom packages.`},{id:`b4`,title:`Editing or removing a deal`,body:`From your store dashboard, find the deal you want to edit and tap on it. You can update the title, description, pricing, photos, category, and expiry date. Save your changes — significant edits may trigger a re-review. To remove a deal entirely, tap ‘Delete’ at the bottom of the edit screen. Deleted deals cannot be recovered.`},{id:`b5`,title:`Hero Spotlight placement`,body:`Hero Spotlight puts your deal in the featured banner at the top of the homepage — the first thing every user sees. It includes a large image, title, description, and a direct ‘View Deal’ button. Pricing is $4.99/day, $9.99/3 days, or $19.99/7 days. You can add Hero Spotlight when posting or from the deal edit screen.`}]},{id:`safety`,name:`Safety & Privacy`,icon:`<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>`,articles:[{id:`s1`,title:`How we protect your data`,body:`ePromotion does not sell your personal data to third parties. We use your information only to provide the service: showing relevant deals, enabling chat, and managing your account. Passwords are encrypted and never stored in plain text. You can request a copy or deletion of your data at any time by contacting support@epromotion.com.`},{id:`s2`,title:`Reporting inappropriate content`,body:`If you encounter inappropriate content — offensive images, misleading deals, spam, or harassment in chat — report it immediately. Open the content in question and use the report option. For chat, long-press a message to report. Our moderation team reviews all reports within 24 hours and takes appropriate action.`},{id:`s3`,title:`Blocking a store or user`,body:`If you want to stop seeing deals from a specific store, visit their store page and tap the menu icon. Select ‘Block’. Blocked stores will no longer appear in your feed. In chat, you can block a user to prevent further messages. You can manage your blocked list from your account settings.`},{id:`s4`,title:`Safe shopping tips`,body:`Always verify deals directly with the store before making large purchases. ePromotion is a discovery platform — transactions happen directly with the business. Check the store’s reviews and verification status. Be cautious of deals that seem too good to be true. If something feels wrong, report it and our team will investigate.`}]}],Se=xe.reduce(function(e,t){return e.concat(t.articles.map(function(e){return Object.assign({},e,{cat:t.name,catId:t.id})}))},[]),[Ce,we]=(0,l.useState)(`all`),[Te,Ee]=(0,l.useState)(nul
